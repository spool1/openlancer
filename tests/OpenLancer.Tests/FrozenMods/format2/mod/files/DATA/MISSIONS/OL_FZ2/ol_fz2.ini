; The frozen format 2 test: a whole mission script of the mod.
[Mission]
npc_ship_file = missions\ol_fz\ol_fz_npcships.ini

[MsnFormation]
nickname = ol_fz2_form
position = 0, 0, 0

[Trigger]
nickname = ol_fz2_start
system = ol_fz_system
InitState = ACTIVE
Cnd_True = no_params
Act_ActTrig = ol_fz2_gate_spawn

[Trigger]
nickname = ol_fz2_end
Cnd_Timer = 10
Act_ChangeState = SUCCEED

[Trigger]
nickname = ol_fz2_gate_spawn
Cnd_Timer = 7
Act_SpawnFormation = ol_fz2_form
Act_ActTrig = ol_fz2_gate_end

[Trigger]
nickname = ol_fz2_gate_end
Cnd_Destroyed = ol_fz2_form, -1
Act_ActTrig = ol_fz2_end
